<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Matching 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .tile {
        aspect-ratio: 1 / 1; border-radius: 18px;
        background: #f7f7f7; border: 2px solid var(--grey);
        font-size: clamp(56px, 18vw, 96px);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: transform .12s, background .15s, border-color .15s;
        box-shadow: 0 4px 0 var(--grey);
      }
      .tile:hover { transform: translateY(-2px); }
      .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--grey); }
      .tile.selected { background: #d6efff; border-color: var(--blue); box-shadow: 0 4px 0 var(--blue-shadow); }
      .tile.matched { background: #d8f4b3; border-color: var(--green); box-shadow: 0 4px 0 var(--green-shadow); cursor: default; pointer-events: none; }
      .tile.shake { animation: shake .35s ease; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎯 Find the matching pair!</h1>
        <div id="themeTitle" class="sub">Tap two of the same to match</div>
        <div id="stars"></div>
      </header>
      <div class="grid" id="grid"></div>
      <footer>
        <button id="reset">↺ New round</button>
      </footer>
      <p class="more-games">Try other games at <a href="/kid-games/">ashoktak.com/kid-games</a> 🎈</p>
      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <div class="big-emoji">🎯</div>
          <h2>Ready to play?</h2>
          <div class="sub" style="font-size:16px;color:#666;font-weight:800;margin-bottom:8px;">5 rounds of fun matching!</div>
          <div class="overlay-buttons">
            <button id="startBtn">▶ Start</button>
          </div>
        </div>
      </div>
      <div id="roundOverlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="big-emoji" id="roundEmoji">🎯</div>
          <h2 id="roundLabel">Round 1</h2>
          <div class="sub" id="roundTheme" style="font-size:18px;color:#666;font-weight:800;"></div>
        </div>
      </div>
      <div id="finishOverlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="big-emoji">🎉</div>
          <h2>Yay! You matched them all!</h2>
          <div class="overlay-buttons">
            <button id="overlayAgain">↺ Play again</button>
            <button id="overlayMore" class="secondary">🎈 More games</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { THEMES } from "../shared/themes.js";
      import { beep, pickRoundOrder, primeSpeech, recordPlay, shuffle, speak, wireControls } from "../shared/game-kit.js";

      const grid = document.getElementById("grid");
      const starsEl = document.getElementById("stars");
      const overlay = document.getElementById("finishOverlay");
      const roundOverlay = document.getElementById("roundOverlay");
      const roundLabel = document.getElementById("roundLabel");
      const roundTheme = document.getElementById("roundTheme");
      const roundEmoji = document.getElementById("roundEmoji");
      const themeTitle = document.getElementById("themeTitle");
      const TOTAL_ROUNDS = 5;
      const SLUG = "match";

      let first = null;
      let lock = false;
      let matched = 0;
      let total = 0;
      let roundIdx = 0;
      let order = [];

      function startGame() {
        order = pickRoundOrder(THEMES.length, TOTAL_ROUNDS);
        roundIdx = 0;
        showRoundIntro();
      }

      function showRoundIntro() {
        const theme = THEMES[order[roundIdx]];
        roundLabel.textContent = `Round ${roundIdx + 1} of ${order.length}`;
        roundTheme.textContent = theme.title;
        roundEmoji.textContent = theme.title.split(" ")[0];
        overlay.classList.add("hidden");
        roundOverlay.classList.remove("hidden");
        speak(`Round ${roundIdx + 1}. ${theme.title.replace(/[^a-zA-Z ]/g, "").trim()}!`);
        setTimeout(() => { roundOverlay.classList.add("hidden"); loadRound(); }, 1800);
      }

      function loadRound() {
        overlay.classList.add("hidden");
        starsEl.textContent = `Round ${roundIdx + 1} / ${order.length}`;
        first = null; lock = false; matched = 0;
        const theme = THEMES[order[roundIdx]];
        themeTitle.textContent = theme.title;
        const pairs = shuffle([...theme.pool]).slice(0, 4);
        total = pairs.length;
        const tiles = shuffle([...pairs, ...pairs]);
        grid.innerHTML = "";
        tiles.forEach((p, i) => {
          const b = document.createElement("button");
          b.className = "tile";
          b.textContent = p.e;
          b.dataset.name = p.name;
          b.dataset.idx = String(i);
          b.addEventListener("click", () => onTile(b));
          grid.appendChild(b);
        });
      }

      function onTile(b) {
        primeSpeech();
        if (lock) return;
        if (b.classList.contains("matched") || b.classList.contains("selected")) return;
        b.classList.add("selected");
        if (!first) { first = b; return; }
        if (first.dataset.name === b.dataset.name) {
          first.classList.add("matched"); b.classList.add("matched");
          first.classList.remove("selected"); b.classList.remove("selected");
          first = null; matched++;
          beep(880); speak(`${b.dataset.name}!`);
          if (matched === total) {
            starsEl.textContent = "⭐⭐⭐";
            const isLast = roundIdx >= order.length - 1;
            if (isLast) {
              recordPlay(SLUG);
              setTimeout(() => { overlay.classList.remove("hidden"); speak("Yay! You matched them all!"); }, 1000);
            } else {
              speak("Great job!");
              setTimeout(() => { roundIdx++; showRoundIntro(); }, 1500);
            }
          }
        } else {
          lock = true;
          const a = first; first = null;
          a.classList.add("shake"); b.classList.add("shake");
          beep(220);
          setTimeout(() => { a.classList.remove("selected", "shake"); b.classList.remove("selected", "shake"); lock = false; }, 700);
        }
      }

      wireControls(startGame);
    </script>
  </body>
</html>
